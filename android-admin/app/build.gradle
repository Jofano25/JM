plugins {
    id 'com.android.application'
}

def adminUrl = System.getenv('JM_ADMIN_URL') ?: 'https://jofano.com/jm-bengkel/'

android {
    namespace 'com.jofano.jmmotoshop.admin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jofano.jmmotoshop.admin'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        buildConfigField 'String', 'ADMIN_URL', '"' + adminUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
