name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          JM_APP_TOKEN: ${{ secrets.JM_APP_TOKEN }}
          JM_APP_URL: https://jofano.com/jm-bengkel/app/index.php
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JM-Motoshop.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JM-Motoshop-APK
          path: android/app/build/outputs/apk/debug/JM-Motoshop.apk
          retention-days: 30
