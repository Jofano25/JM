name: Build JM Motoshop Admin APK

"on":
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/admin-build.yml'

jobs:
  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Validate Admin project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-admin/settings.gradle
          test -f android-admin/app/build.gradle
          test -f android-admin/app/src/main/AndroidManifest.xml
          echo "JM Motoshop Admin project OK"

      - name: Build Admin APK
        shell: bash
        env:
          JM_ADMIN_URL: https://jofano.com/jm-bengkel/
        run: |
          set -euo pipefail
          cd android-admin
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          SRC="android-admin/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SRC"
          mkdir -p artifacts
          cp "$SRC" artifacts/JM-Motoshop-Admin.apk
          ls -lh artifacts/JM-Motoshop-Admin.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: JM-Motoshop-Admin-APK
          path: artifacts/JM-Motoshop-Admin.apk
          retention-days: 30
          if-no-files-found: error
